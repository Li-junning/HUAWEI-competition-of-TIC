[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-answer-verifier-backend"
version = "0.1.0"
description = "安全、可复核的 AI 答案可信度验证后端 MVP"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100",
  "httpx>=0.27",
  "pydantic>=2.0",
  "uvicorn>=0.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
