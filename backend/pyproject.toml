[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-answer-verifier-backend"
version = "0.1.0"
description = "安全、可复核的 AI 答案可信度验证后端 MVP"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "httpx>=0.27",
  "pydantic>=2.0",
  "uvicorn>=0.53,<0.54",
  "pypdf>=6.19,<7",
  "python-docx>=1.2,<2",
]

[project.optional-dependencies]
knowledge = ["fastembed>=0.7,<1"]
dev = [
  "pytest>=8.0",
  "pip-audit>=2.10.1,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
